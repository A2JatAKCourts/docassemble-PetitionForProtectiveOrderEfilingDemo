  - Yakutat
---
event: penultimate_screen
question: |
  Final screen
subquestion: |
  Stick in a final screen just so we don't get the error message

  Also reckoning variables along the way:

  * who_needs_the_order: ${ who_needs_the_order }
  * users: ${ users }
  * al_person_answering: ${ al_person_answering }
  * users.target_number: ${ users.target_number }
  
  * al_person_answering: ${ al_person_answering }
  % if who_needs_the_order in ('child', 'children'):
  % if advocate.is_dv_advocate:
  * Advocate name: ${ advocate.name.full() }
  % if advocate.is_attorney:
  * advocate.bar_number:  ${ advocate.bar_number }
  % endif
  % endif
  * I am
  % for i in range(users.number()):
  ${users[i].name.familiar()}'s ${ users[i].relationship_to_advocate }
  % endfor
  % endif


  ## Respondent
  * Respondent name: ${ other_parties.name }
  * Respondent's birthdate:  ${ showifdef("other_parties.birthdate") }
  * Is ${ other_parties.name.familiar() } a child? ${ "Yes" if other_parties.age_in_years() < 18 else "No" }
  % if other_parties.age_in_years() < 18:
  * adult_for_respondent: ${ adult_for_respondent }
    * their birthdate: ${ adult_for_respondent.birthdate }
    * their relationship to respondent: ${ other_parties.relationship_to_person_signing_for_them }
  % endif

  ## Type of Protective Order petition
  
  The ${"petitioner" if who_needs_the_order in ('myself', 'child') else "petitioners"} should get a **${ protective_order_petition_type }** petition. 

  They are filing in ${ court_location } 

continue button field: penultimate_screen
---
comment: |
  Delete until we have review screens set up:
    ${ action_button_html(url_action('review_protective_order_petition'), label=word('Edit answers'), color='info') }
id: download protective_order_petition
event: protective_order_petition_download
question: |
  All done
subquestion: |
  Thank you ${users}. Your form is ready to download and deliver.

  Use the options on this page to view, download and send your form. Use the
  "Edit answers" button to fix any mistakes.



  ${ al_user_bundle.download_list_html() }

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

progress: 100
---
---
# ALDocument objects specify the metadata for each template
objects:
  - protective_order_petition_post_interview_instructions: ALDocument.using(title="Instructions Next Steps - Do not file", filename="protective_order_petition_next_steps", enabled=True)
  
  
  - domestic_violence_protective_order_petition: ALDocument.using(title="Domestic Violence Protective Order Petition", filename="domestic_violence_protective_order_petition", has_addendum=False)
  - sexual_assault_petition: ALDocument.using(title="Sexual Assault Protective Order Petition", filename="sexual_assault_protective_order_petition", has_addendum=True)
  - stalking_petition: ALDocument.using(title="Stalking Protective Order Petition", filename="stalking_protective_order_petition", has_addendum=True)
  - domestic_violence_protective_order_petition_multi: ALDocument.using(title="Domestic Violence Protective Order Petition for Multiple Petitioners", filename="domestic_violence_protective_order_petition_multi", has_addendum=True)
  
  
  - dv_127_confidential_law_enforcement_information_sheet: ALDocument.using(title="DV-127 Confidential Law Enforcement Information Sheet", filename="dv_127_confidential_law_enforcement_information_sheet", enabled=True, has_addendum=False)
  

  - dv_128_confidential_contact_information_sheet: ALDocument.using(title="DV-128-Confidential-Contact-Information-Sheet", filename="dv_128_confidential_contact_information_sheet", has_addendum=False)
  

  - tf_835_self_certification_no_notary_available: ALDocument.using(title="TF 835 Self Certification No Notary Available", filename="tf_835_self_certification_no_notary_available", enabled=True, has_addendum=False)
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[protective_order_petition_post_interview_instructions, domestic_violence_protective_order_petition, domestic_violence_protective_order_petition_multi, dv_127_confidential_law_enforcement_information_sheet,dv_128_confidential_contact_information_sheet, tf_835_self_certification_no_notary_available], title="Your Petition for a Protective Order", filename="protective_order_petition_bundle", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[domestic_violence_protective_order_petition, domestic_violence_protective_order_petition_multi,dv_127_confidential_law_enforcement_information_sheet,dv_128_confidential_contact_information_sheet, tf_835_self_certification_no_notary_available], title="Petition for a Protective Order", filename="protective_order_petition_bundle", enabled=True)
---
code: |


  dv_127_confidential_law_enforcement_information_sheet.enabled = True
  protective_order_petition_post_interview_instructions.enabled = True
---
template: protective_order_petition_post_interview_instructions.title
content: |
  Instructions
---
template: protective_order_petition_attachment.title
content: |
  Protective Order petition
---
template: al_user_bundle.title
content: |
  All forms to download for your records
---
template: al_court_bundle.title
content: |
  All forms to deliver to court
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: protective_order_petition_next_steps
  variable name: protective_order_petition_post_interview_instructions[i]
  docx template file: protective_order_petition_next_steps.docx
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: DV-127 Confidential Law Enforcement Information Sheet
  filename: DV-127-Confidential-Law-Enforcement-Information-Sheet
  pdf template file: dv_127_confidential_law_enforcement_information_sheet.pdf
  variable name: dv_127_confidential_law_enforcement_information_sheet[i]
  skip undefined: True
  tagged pdf: True
  fields:
      - "petitioners_name": ${ users[0] }
      - "petitioners_birthdate": ${ users[0].birthdate }
      - "petitioners_is_child": ${ users[0].age_in_years() < 18 }
      - "petitioners_address": |
          % if who_needs_the_order in ('child', 'children'):
          ${ advocate.address.on_one_line() }
          % else:
          ${ users[0].address.on_one_line() }
          % endif
      - "petitioners_stay_away_address_yes": ${ users[0].stay_away_from_address }
      - "petitioners1_stay_away_address_no": ${ not users[0].stay_away_from_address }
      - "notify_petitioner_when_defendant_is_served_yes": ${ users[0].notify_when_served }
      - "notify_petitioner_when_defendant_is_served_no": ${ not users[0].notify_when_served }
      - "petitioners_mobile_number": |
          % if who_needs_the_order in ('child', 'children'):
          ${ phone_number_formatted(advocate.mobile_number) }
          % else:
          ${ phone_number_formatted(users[0].mobile_number) }
          % endif
      - "petitioners_other_number": |
          % if who_needs_the_order in ('child', 'children'):
          ${ phone_number_formatted(advocate.other_number) }
          % else:
          ${ phone_number_formatted(users[0].other_number) }
          % endif
      - "petitioners_email": |
          % if who_needs_the_order in ('child', 'children'):
          ${ advocate.email }
          % else:
          ${ users[0].email }
          % endif
      - "petitioners_cell_messages_safe_yes": ${ users[0].cell_messages_safe }
      - "petitioners_cell_messages_safe_no": ${ not users[0].cell_messages_safe }
      - "petitioners_other_phone_messages_safe_yes": ${ users[0].other_phone_messages_safe }
      - "petitioners_other_phone_messages_safe_no": ${ not users[0].other_phone_messages_safe }
      - "petitioners_email_safe_yes": ${ users[0].email_safe }
      - "petitioners_email_safe_no": ${ not users[0].email_safe }
      - "petitioners_unavailable_times": ${ users[0].unavailable_times }
      - "respondents_name": ${ other_parties }
      - "respondents_aliases": ${ other_parties.alias_text_list }
      - "respondents_is_child": ${ other_parties.age_in_years() < 18 }
      - "respondents_address": |
          % if other_parties.age_in_years() < 18:
          ${ adult_for_respondent.address.on_one_line() }
          % else:
          ${ other_parties.address.on_one_line() }
          % endif
      - "respondents_ssn_last_four": ${ other_parties.ssn_last_four }
      - "stay_away_from_respondents_residence_yes": ${ other_parties.stay_away_from_residence }
      - "stay_away_from_respondents_residence_no": ${ not other_parties.stay_away_from_residence }
      - "respondents_other_addresses": ${ other_parties.other_addresses }
      - "respondents_mobile_number": |
          % if other_parties.age_in_years() < 18:
          ${ phone_number_formatted(adult_for_respondent.mobile_number) }
          % else:
          ${ phone_number_formatted(other_parties.phone_number) }
          % endif
      - "respondents_other_number": |
          % if other_parties.age_in_years() < 18:
          ${ phone_number_formatted(adult_for_respondent.other_number) }
          % else:
          ${ phone_number_formatted(other_parties.other_number) }
          % endif
      - "respondents_email": |
          % if other_parties.age_in_years() < 18:
          ${ adult_for_respondent.email }
          % else:
          ${ other_parties.email }
          % endif
      - "respondents_current_location_address": ${ other_parties.current_location_address }
