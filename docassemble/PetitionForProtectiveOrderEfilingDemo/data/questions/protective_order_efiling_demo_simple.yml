########################################################################
# Stay away from petitioner's home
#   1. Ask whether the petitioner wants the court to order a stay away.
#   2. Only if yes: does the respondent live with the petitioner?
#   3. Only if no: does the respondent know where the petitioner lives?
#   respondent_stay_away_from_petitioners_home is the only flag. There is no
#   stay_away_address_collected variable any more.
########################################################################
id: Stay away from petitioner's home
question: |
  % if petitioner_group == 'you':
  The judge can order ${ respondent_name } to stay away from the place you live
  % elif petitioner_group == 'one person':
  The judge can order ${ respondent_name } to stay away from the place ${ users[0].familiar() } lives
  % elif petitioner_group == 'you and children' and users.target_number == 2:
  The judge can order ${ respondent_name } to stay away from the place you and ${ users[1].familiar() } live
  % elif petitioner_group == 'children':
  The judge can order ${ respondent_name } to stay away from the place ${ "the" if who_needs_the_order == 'lawyer' else "your" } children live
  % else:
  The judge can order ${ respondent_name } to stay away from the place you and ${ "the" if who_needs_the_order == 'lawyer' else "your" } children live
  % endif
subquestion: |
     If the judge orders ${ respondent_name } to stay away from a place, the address for that place goes into the order.

     If ${ respondent_name } does not already know it, ${ respondent_name } will learn the address of the place because the address will be in the order.
fields:
  - "Do you need the judge to order ${ respondent_name } to stay away from ${ petitioner_possesive_pronoun } place?": respondent_stay_away_from_petitioners_home
    datatype: yesnoradio
  - Does ${ respondent_name } live with ${ petitioner_personal_pronoun }?: respondent_live_with_petitioners
    datatype: yesnoradio
    js show if: |
      val("respondent_stay_away_from_petitioners_home") === true
  - Does ${ respondent_name } know where ${ petitioner_personal_pronoun } ${ "lives" if petitioner_group == 'one person' else "live" }?: respondent_knows_where_petitioners_live
    datatype: yesnomaybe
    js show if: |
      val("respondent_stay_away_from_petitioners_home") === true &&
      val("respondent_live_with_petitioners") === false
---
id: petitioners stay away from home address
sets:
 - "users[0].stay_away_home_address.address"
 - "users[0].stay_away_home_address.unit"
 - "users[0].stay_away_home_address.city"
 - "users[0].stay_away_home_address.state"
 - "users[0].stay_away_home_address.zip"
question: |
  What is the address you need the judge to order ${ respondent_name } to stay away from?
subquestion: |
  % if respondent_live_with_petitioners is False and not respondent_knows_where_petitioners_live:
  <div class="alert alert-warning" role="alert">
   <strong>from outline</strong>: You said you ${ respondent_name } does not know your address or you do not know if ${ respondent_name } knows your address.   If you want the judge to order ${ respondent_name } to stay away from it, you have to give the address so ${ respondent_name } knows where to say away and law enforceement can . . . ] If you want to keep your your physical address confidential. Go back and say you do not want the judge to order ${ respondent_name } to stay away from your address. What is safer - keeping your physical address confidential or putting it on the form so you can call law enforcement if ${ respondent_name } comes to your residence.
  So what do you want to do?
  nlocude [addrerss] as a place to stay away on the order
  Keep [address] confidential even though the court cannot order ${ respondent_name } to stay away.
  </div>
  % endif
fields:
