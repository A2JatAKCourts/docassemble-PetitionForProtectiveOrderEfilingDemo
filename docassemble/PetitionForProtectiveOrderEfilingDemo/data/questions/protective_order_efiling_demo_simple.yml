      {'stay away': f"I want the judge to order { other_parties.name.familiar() } to stay away from the place I live." },
      {'keep confidential': f"It is more important to me that { other_parties.name.familiar() } does not see the address of the place I live on the order." },
    ]
  elif who_needs_the_order == 'child':
