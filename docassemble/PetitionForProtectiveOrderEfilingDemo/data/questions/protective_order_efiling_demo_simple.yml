code: |
  # DV-128 is about the contact person, so when the advocate is the contact person (a guardian, or a parent
  # filing for children) this has to be the advocate's name, not users[0] (the person who needs the order).
  # Despite its name this variable now holds the CONTACT PERSON's name (plus aliases, if any were given).
  if advocate_is_contact_person:
    contact_person_prefix = 'advocate'
  else:
    contact_person_prefix = 'users[0]'
  contact_person = advocate if advocate_is_contact_person else users[0]
  # Check if the text field has content and isn't just spaces
  if defined(contact_person_prefix + '.alias_text_list') and contact_person.alias_text_list.strip():
    users_with_aliases = f"{contact_person} (AKA: {contact_person.alias_text_list.strip()})"
  else:
    users_with_aliases = str(contact_person)
