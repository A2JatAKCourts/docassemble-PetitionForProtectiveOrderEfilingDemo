---
id: Stay away from petitioner's home
question: |
  % if who_needs_the_order == 'myself':
  The judge can order ${ other_parties.familiar() } to stay away from the place you live
  % elif who_needs_the_order == 'child':
  The judge can order ${ other_parties.familiar() } to stay away from the place ${ users[0].familiar() } lives
  % elif who_needs_the_order == 'self and child':
  The judge can order ${ other_parties.familiar() } to stay away from the place you and ${ users[1].familiar() } live
  % elif who_needs_the_order == 'children':
  The judge can order ${ other_parties.familiar() } to stay away from the place your children live
  % elif who_needs_the_order == 'self and children':
  The judge can order ${ other_parties.familiar() } to stay away from the place you and your children live
  % endif
subquestion: |
     If the judge orders ${ other_parties.familiar() } to stay away from a place, the address for that place goes into the order.

     If ${ other_parties.name.familiar() } does not already know it, ${ other_parties.name.familiar() } will learn the address of the place because the address will be in the order.
fields:
  - Does ${ other_parties.name.familiar() } live with ${petitioner_personal_pronoun}?: respondent_live_with_petitioners
    datatype: yesnoradio
  - Does ${ other_parties.name.familiar() } know where ${ petitioner_personal_pronoun } ${ "lives" if who_needs_the_order == 'child' else "live" }?: respondent_knows_where_petitioners_live
    datatype: yesnomaybe
    show if:
      variable: respondent_live_with_petitioners
      is: False
  - label: |
      Do you need the judge to order ${other_parties.name.familiar()} to stay away from ${ petitioner_possesive_pronoun } place? **or** Do you need to keep that address confidential so it does **not** go onto the order where ${ other_parties.name.familiar() } can see it?
    field: stay_away_home_address_or_keep_confidential
    datatype: radio
    choices:
      code: |
        stay_away_home_address_or_keep_confidential_choices
    js show if: |
      val("respondent_live_with_petitioners") === false &&
      val("respondent_knows_where_petitioners_live") !== null &&
      val("respondent_knows_where_petitioners_live") !== true
    label above field: True

  - "Do you need the judge to order ${other_parties.name.familiar()} to stay away from ${ petitioner_possesive_pronoun } place?": respondent_stay_away_from_petitioners_home
    datatype: yesnoradio
    js show if: |
      val("respondent_live_with_petitioners") === true ||
      (
        val("respondent_live_with_petitioners") === false &&
        val("respondent_knows_where_petitioners_live") === true
      )
---
code: |
  if who_needs_the_order == 'myself':
