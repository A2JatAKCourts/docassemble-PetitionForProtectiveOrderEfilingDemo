comment: |
  2026-09-08
  This is a simple version of the protective order efiling demo.
  Building the gathering portion for adults, and children.
  Testing PDFs, DV-100, DV-100m, and CIV-750 for sexual assault, CIV-752 for stalking.
---
include:
  - docassemble.AssemblyLine:assembly_line.yml
  - docassemble.ALAnyState:any_state.yml
  - docassemble.AKA2JBranding:custom_organization.yml
  - protective_order_interview_order.yml
---
id: alweaver assemblyline settings
initial: True
code: |
  # These exact-name variables drive the reusable next-steps DOCX shell and
  # are editable in Weaver's AssemblyLine settings panel.
  user_role = "plaintiff"
  user_ask_role = "plaintiff"
  al_next_steps_enabled = False
  al_next_steps_intro_prompt = 'File your Protective Order petition today'
  al_next_steps_title = 'Protective Order petition'
  al_next_steps_document_title = 'petition'
  al_next_steps_document_purpose = 'application'
  al_next_steps_help_organization = 'Alaska Legal Services Corporation'
  al_next_steps_help_url = 'https://www.alsc-law.org'
  al_next_steps_generate_qr_code = False
  al_next_steps_what_happens_next = 'After you submit your petition, the court will review your request. If granted, the protective order will help keep you and your children safe from the respondent. You may need to attend a hearing for long-term orders.'
  al_next_steps_what_can_decision_maker_do = 'The judge can issue temporary protective orders or schedule a hearing for long-term orders. They can also deny the request if there is insufficient evidence.'
  al_next_steps_what_happens_if_i_win = 'If you win the protective order, you will receive legal protection against the respondent for the duration specified. This may include restrictions on contact and requirements for the respondent to stay away from you and your children.'
---
objects:
  - users: ALPeopleList.using(ask_number=True)
  - advocate: ALIndividual
  - children: ALPeopleList.using(there_are_any=True, complete_attribute='complete')
  - other_parties: ALIndividual
  - adult_for_respondent: ALIndividual
---
mandatory: True
code: |
  who_needs_the_order

  interview_order_finished
  protective_order_petition_download
---  

---
id: who needs a protective order
question: |
  Who needs protection?
fields:
  - Who is the order for?: who_needs_the_order
    datatype: radio
    choices:
    - "me. I need a protective order for myself": myself
    - "My child": child
    - "Myself and my minor child": self and child
    - "More than one of my minor children": children
    - "Myself and more than one of my minor children": self and children
under: |
  #### <i class="fa-regular fa-lightbulb"></i> Learn more####
  If I get a protective order, does it include my child?

  Your child can be included in your protective order or have their own protective order depending on what you ask for.

  Ask for yourself: If you have children with the person you are asking for the protective order against, you can ask the judge to:

    *	make some temporary orders about where the child will live;
    *	order child support; and
    *	order the other person to stay away from specific locations, including your child's school.

  You can ask for these things even if the other person did not commit domestic violence against your child.

  Ask for yourself and your child: You can ask for a protective order for yourself and your child, if your child meets all of the protective order requirements. For example, the other person must have committed domestic violence against your child. You can also ask the judge to:

    *	make some temporary orders about where the child will live;
    *	order child support; and
    *	order the other person to stay away from specific locations, including your child's school.

  You must decide before you fill out the court forms so you know which form to use. The court has 2 different forms to ask for a protective order. The forms are called a petition. One petition asks for a protective order for 1 person. The other petition asks for a protective order for more than 1 person.
---
code: |
  if who_needs_the_order in ('child', 'children'):
    al_person_answering = 'advocate'
  else:
    al_person_answering = 'user'
---
question: |
  How many people, ${ "including yourself," if who_needs_the_order == 'self and children' else "all together,"} need this order?
fields:
  - Number of people: users.target_number
    datatype: integer
    min: 2
    max: 11
---
id: protected person name
sets:
  - users[i].name.first
  - users[i].name.middle
  - users[i].name.last
  - users[i].name.suffix
question: |
  % if i == 0 and who_needs_the_order in ('self', 'self and child', 'self and children'):
  What is your name and birthdate?
  % elif (i == 0 and who_needs_the_order == 'child') or (i == 1 and who_needs_the_order == 'self and child'):
  What is your child's name and birthdate?
  % elif who_needs_the_order in ('self and children','children'):
  What is the name and birthdate of the 
  % if who_needs_the_order == 'children':
  ${ ordinal(i) } 
  % elif who_needs_the_order == 'self and children':
  ${ ordinal(i - 1) }
  % endif
  child who needs the protective order?
  % endif
fields:
  - code: |
      users[i].name_fields()
  - birthdate: users[i].birthdate
    datatype: date
---
id: Advocate info
sets:
  - advocate.name.first
  - advocate.name.middle
  - advocate.name.last
  - advocate.name.suffix
question: |
  If you are asking the court for a protective order for someone else
subquestion: |
  To file a petition for a Protective Order for someonw else, you need to be:
  
    * 18, 
    * a domestic violence advocate, or
    * a lawyer.
fields:
  - code: |
        advocate.name_fields()
  - Are you a domestic violence advocate?: advocate.is_dv_advocate
    datatype: yesno
  - Are you an attorney?: advocate.is_attorney
    datatype: yesno
    show if: advocate.is_dv_advocate    
  - Attorney bar number: advocate.bar_number
    show if:
      variable: advocate.is_attorney
      is: True
  - Advocate birthdate: advocate.birthdate
    datatype: date
    show if: 
      variable: advocate.is_dv_advocate
      is: False
---
id: relationship to advocate
sets:
  - users[i].relationship_to_advocate
question: |
  How do you know ${ users[i] }?
fields:
  - I am ${ users[i].name.familiar() }'s: users[i].relationship_to_advocate
---
id: Respondent's name and birthdate
sets:
  - other_parties.name.first
  - other_parties.name.middle
  - other_parties.name.last
  - other_parties.name.suffix
question: |
  What is the name of the person 
  % if who_needs_the_order == 'myself':
  you
  % elif who_needs_the_order == 'child':
  ${ users[1].name.familiar() } needs
  % elif who_needs_the_order == 'children':
  ${ comma_and_list([u.name.familiar() for u in users]) } need
  % elif who_needs_the_order in ('self and child', 'self and children'):
  you and ${ comma_and_list([u.name.familiar() for u in users[1:]]) } need
  % endif
  protection from?
fields:
  - code: |
      other_parties.name_fields()
---
id: respondent birthdate
question: |
  How old is ${ other_parties.name.familiar() }?  
fields:
  - Do you know ${ other_parties.name.familiar() }'s birthdate?: knows_respondents_birthdate
    datatype: yesnoradio
    label above field: True
  - What is ${ other_parties.name.familiar() }'s birthdate?: other_parties.birthdate
    datatype: BirthDate
    show if:
      variable: knows_respondents_birthdate
      is: True
    label above field: True
  - How old do you think ${ other_parties.name.familiar() } is, in years?: other_parties.age
    datatype: integer
    show if:
      variable: knows_respondents_birthdate
      is: False
    label above field: True
---
id: adult for under-age respondent
sets:
  - adult_for_respondent.name.first
  - adult_for_respondent.name.middle
  - adult_for_respondent.name.last
  - adult_for_respondent.name.suffix
question: |
  Who is responsible for ${ other_parties.name.familiar() }?
fields:
  - Do you know ${ other_parties.name.familiar() }'s parent's or guardian's name?: knows_adult_for_respondent
    datatype: yesnoradio
    label above field: True
  - code: |
      adult_for_respondent.name_fields(
        show_if={
          "variable": "knows_adult_for_respondent",
          "is": True,
        }
      )
  
---
id: Respondent's contact info
sets:
  - other_parties.address.address
  - other_parties.address.city
  - other_parties.address.zip
  - other_parties.address.unit
  - other_parties.address.state
  - other_parties.phone_number
question: |
  How can the court get in touch with ${ other_parties.name.familiar()} ?
fields: 
  - code: |
      other_parties.address_fields()
  - Phone: other_parties.phone_number
---
id: Respdondent's adult contact info
sets:
  - adult_for_respondent.address.address
  - adult_for_respondent.address.city
  - adult_for_respondent.address.zip
  - adult_for_respondent.address.unit
  - adult_for_respondent.address.state
  - adult_for_respondent.mobile_number
  - adult_for_respondent.home_number
  - adult_for_respondent.work_number
  - adult_for_respondent.phone_number
  - adult_for_respondent.other_number
question: |
  How can the court get in touch with ${ adult_for_respondent }?
fields: 
  - code: |
      adult_for_respondent.address_fields()
  - cell phone: adult_for_respondent.mobile_number
  - home phone: adult_for_respondent.home_number
  - work phone: adult_for_respondent.work_number
  - other phone: adult_for_respondent.other_number
---
question: |
  Does ${ other_parties } go by any other names?
fields:
  - Do they have any nicknames or aliases?: other_parties_aliases
    datatype: yesnoradio
  - What other names do people know them as?: other_parties.alias_text_list
    datatype: area
    show if: other_parties_aliases
    
---
code: |
  # Check if the text field has content and isn't just spaces
  if defined('other_parties.alias_text_list') and other_parties.alias_text_list.strip():
    users_with_aliases = f"{users[0]} (AKA: {users[0].alias_text_list.strip()})"
  else:
    users_with_aliases = str(users[0])
---
id: Keeping filer's address confidential
question: |
  Do you need the court to keep your contact information confidential?
subquestion: |
  The court needs your mailing address so they can send court papers and notices about your hearing dates to you. If you do not have an address, email, or telephone number that can safely be shown to ${ other_parties.name.familiar() }, you can put this information on the **Confidential Contact Information Sheet, DV-128**. The court will keep that form confidential (secret) and not reveal it to ${ other_parties.name.familiar() }.
fields:
  - "Do you need to use DV-128?": petitioners_using_dv128
    datatype: yesnoradio
---
code: |
  dv_128_confidential_contact_information_sheet.enabled = petitioners_using_dv128
---
id: Petitioner's aliases
question: |
  % if who_needs_the_order in ('myself', 'self and child', 'self and children'):
  Do you
  % elif who_needs_the_order == "child":
  Does ${ users[0].familiar() }
  % else:
  Do ${ users[0].familiar() }
  % endif
  go by any *other* names?
fields:
  - "Do ${ 'you' if who_needs_the_order in ('myself', 'self and child', 'self and children') else 'they' } have any nicknames or aliases?": users_aliases
    datatype: yesnoradio
  - "What other names do people know ${ 'you' if who_needs_the_order in ('myself', 'self and child', 'self and children') else 'them' } as?": users[0].alias_text_list
    datatype: area
    show if: users_aliases
---
code: |
  # Check if the text field has content and isn't just spaces
  if defined('users[0].alias_text_list') and users[0].alias_text_list.strip():
    users_with_aliases = f"{users[0]} (AKA: {users[0].alias_text_list.strip()})"
  else:
    users_with_aliases = str(users[0])
---
id: "Petitioner's contact info"
question: How can the court get in touch with you?
fields:
  - code: |
      users[0].address_fields()
  - label: Cell phone
    field: "users[0].mobile_number"
    required: False
  - label: Other phone
    field: "users[0].other_number"
    required: False
  - label: Email
    field: "users[0].email"
    required: False
sets:
  - "users[0].phone_number"
  - "users[0].address.address"
  - "users[0].address.city"
  - "users[0].address.zip"
  - "users[0].address.unit"
  - "users[0].address.state"
  - "users[0].address.country"
help: |
  You _must_ provide contact information so the court can reach you.
  
  You will have a chance to tell the court that you need to keep your address, phone,
  and email confidential, so that only court staff can see this information.
validation code: |
  if (not showifdef('users[0].mobile_number') and \
      (not showifdef('users[0].other_number')) and \
      (not showifdef('users[0].email'))):
    validation_error(word("You need to give at least one contact method."), field="users[0].other_contact_method")
---
id: Advocate's contact info
sets:
  - advocate.address.address
  - advocate.address.city
  - advocate.address.zip
  - advocate.address.unit
  - advocate.address.state
  - advocate.mobile_number
  - advocate.other_number
question: |
  How can the court get in touch with you?
fields: 
  - code: |
      advocate.address_fields()
  - cell phone: advocate.mobile_number
  - other phone: advocate.other_number

---
id: For demo - which form do you want to complete?
question: |
  Which petition do you want to complete?
fields:
  - Petition: protective_order_petition_type
    datatype: radio
    choices: 
      - Petition for Domestic Violence Protective Order: DV-100
      - Petition for Sexual Assault Protective Order: CIV-750
      - Petition for Stalking Protective Order: CIV-752
---
code: |
  if who_needs_the_order in ('myself', 'child'):
    domestic_violence_protective_order_petition.enabled = protective_order_petition_type == 'DV-100'
    # sexual_assault_protective_order_petition.enabled = protective_order_petition_type == 'CIV-750'
    # stalking_protective_order_petition.enabled = protective_order_petition_type == 'CIV-752'
    domestic_violence_protective_order_petition_multi.enabled = False
  else:
    domestic_violence_protective_order_petition_multi.enabled = True
    domestic_violence_protective_order_petition.enabled = False
    # sexual_assault_protective_order_petition.enabled = False
    # stalking_protective_order_petition.enabled = False

---
id: court location
question: |
  What court do you want to file in?
field: court_location
dropdown:
  - Anchorage
  - Angoon
  - Aniak
  - Bethel
  - Cordova
  - Delta Junction
  - Dillingham
  - Emmonak
  - Fairbanks
