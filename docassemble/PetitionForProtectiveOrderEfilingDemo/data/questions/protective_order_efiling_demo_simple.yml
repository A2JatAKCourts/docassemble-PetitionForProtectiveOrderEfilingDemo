# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: protective_order_petition_next_steps
  variable name: protective_order_petition_post_interview_instructions[i]
  docx template file: protective_order_petition_next_steps.docx
  # docx template file: dummy.docx
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: DV-127 Confidential Law Enforcement Information Sheet
  filename: DV-127-Confidential-Law-Enforcement-Information-Sheet
  pdf template file: dv_127_confidential_law_enforcement_information_sheet.pdf
  variable name: dv_127_confidential_law_enforcement_information_sheet[i]
  skip undefined: True
  tagged pdf: True
  # TODO (new DV-127 PDF): when the new DV-127 is added, its phone and email fields (petitioners_mobile_number,
  # petitioners_other_number, petitioners_email, or whatever the new field names are) must print EVERY phone
  # number and email the user gave us, confidential or not. Right now they only read the regular fields
  # (phone_number, other_number, email), so a number or email marked confidential prints blank.
  # For each one, use the regular value if it is set, otherwise the confidential one, with showifdef, e.g.
  #   ${ showifdef('users[0].phone_number', showifdef('users[0].confidential_phone_number', '')) }
  # (and the same for advocate.* when advocate_is_contact_person). Do not mix undefined variables in one field:
  # with `skip undefined: True` one undefined variable blanks the whole field.
  fields:
      - "petitioners_name": ${ users[0] }
      - "petitioners_birthdate": ${ users[0].birthdate }
      - "petitioners_is_child": ${ users[0].age_in_years() < 18 }
      - "petitioners_address": ${ users[0].stay_away_home_address.on_one_line() if respondent_stay_away_from_petitioners_home else "" }
      - "petitioners_stay_away_address_yes": ${ respondent_stay_away_from_petitioners_home }
      - "petitioners1_stay_away_address_no": ${ not respondent_stay_away_from_petitioners_home }
      - "notify_petitioner_when_defendant_is_served_yes": ${ users[0].notify_when_served }
      - "notify_petitioner_when_defendant_is_served_no": ${ not users[0].notify_when_served }
      - "petitioners_mobile_number": |
          % if advocate_is_contact_person:
          ${ advocate.phone_number }
          % else:
          ${ users[0].phone_number }
          % endif
      - "petitioners_other_number": |
          % if advocate_is_contact_person:
          ${ advocate.other_number }
          % else:
          ${ users[0].other_number }
          % endif
      - "petitioners_email": |
          % if advocate_is_contact_person:
          ${ advocate.email }
          % else:
          ${ users[0].email }
          % endif
      - "petitioners_cell_messages_safe_yes": ${ users[0].cell_messages_safe }
      - "petitioners_cell_messages_safe_no": ${ not users[0].cell_messages_safe }
      - "petitioners_other_phone_messages_safe_yes": ${ users[0].other_phone_messages_safe }
      - "petitioners_other_phone_messages_safe_no": ${ not users[0].other_phone_messages_safe }
      - "petitioners_email_safe_yes": ${ users[0].email_safe }
      - "petitioners_email_safe_no": ${ not users[0].email_safe }
      - "petitioners_unavailable_times": ${ users[0].unavailable_times }
      - "respondents_name": ${ other_parties[0] }
      - "respondents_aliases": ${ other_parties[0].alias_text_list }
      - "respondents_is_child": ${ other_parties[0].age_in_years() < 18 }
      - "respondents_address": |
          % if other_parties[0].age_in_years() < 18 and respondent_address_unknown and knows_adult_for_respondent and not adult_for_respondent_address_unknown:
          ${ adult_for_respondent.address.block() } (parent or guardian)
          % else:
          % if not respondent_address_unknown:
          ${ other_parties[0].address.block() }
          % endif
          % endif
      - "respondents_ssn_last_four": ${ other_parties[0].ssn_last_four }
      - "stay_away_from_respondents_residence_yes": ${ other_parties[0].stay_away_from_residence }
      - "stay_away_from_respondents_residence_no": ${ not other_parties[0].stay_away_from_residence }
      - "respondents_other_addresses": ${ other_parties[0].other_addresses }
      - "respondents_mobile_number": |
          ${ other_parties[0].phone_number }
          % if other_parties[0].age_in_years() < 18:
          ${ adult_for_respondent.phone_number } (parent/guardian)
          % endif
      - "respondents_other_number": |
          ${ other_parties[0].other_number }
          % if other_parties[0].age_in_years() < 18:
          ${ adult_for_respondent.other_number } (parent/guardian)
          % endif
      - "respondents_email": |
          ${ other_parties[0].email }
          % if other_parties[0].age_in_years() < 18:
          ${ adult_for_respondent.email } (petitioner/guardian)
          % endif
      - "respondents_current_location_address": ${ other_parties[0].current_location_address }
      - "respondents_sex": ${ other_parties[0].gender }
      - "respondents_race": ${ other_parties[0].race }
      - "respondents_birthdate": |
          % if knows_respondents_birthdate:
          ${ other_parties[0].birthdate }
          % else:
          ${ other_parties[0].age } years
          % endif
      - "respondents_height": ${ other_parties[0].height }
      - "respondents_weight": ${ other_parties[0].weight }
      - "respondents_hair_color": ${ other_parties[0].hair_color }
      - "respondents_eye_color": ${ other_parties[0].eye_color }
      - "respondents_state_id_drivers_license": ${ other_parties[0].drivers_license }
      - "respondents_id_state": ${ other_parties[0].drivers_license_state }
      - "respondents_friends_contacts": ${ other_parties[0].friends_contacts }
      - "respondents_home_hazards": ${ other_parties[0].home_hazards }
      - "respondents_other_physical_identifiers": ${ other_parties[0].other_physical_identifiers }
