########################################################################
# Term (short or long)
########################################################################
id: short or long term
question: |
  How long do you need the order to last?
subquestion: |
  You can ask the court for an order that lasts 20 days, an order that lasts up to a year, or both.
fields:
  - I need the order to last: term
    input type: radio
    choices:
      - "20 days": 20 days
        help: |
          A **Short-Term Protective Order** (also called an “ex parte” order) gives you immediate protection.  It lasts for 20 days unless the judge extends it. The judge is able to grant or deny the petition based only on what you write in the petition and what you testify about at the hearing, if there is a hearing. The judge can grant this protective order without telling ${ respondent_name } that you filed a petition, and without hearing from ${ respondent_name }. You do not have to tell the ${ respondent_name } that you are asking for a protective order, but if you did, tell the judge how you tried to tell ${ respondent_name } you were asking for the protective order.
      - "up to one year": 1 year
        help: |
          A **Long-Term Order** can last up to one year. A judge can only grant a long-term order after a hearing. ${ respondent_name } must get at least 10 days’ notice of the court hearing and have a chance to speak at the hearing. If ${ respondent_name } had notice, but chose not to come to the hearing, the judge can still grant the order. Police officers or troopers are responsible for notifying ${ respondent_name } about the hearing.
      - "I need **both** a 20 day order and an order that lasts up to a year": both
        help: |
           Both a Short-Term and a Long-Term Order. If you request both orders, and your short-term order is granted, the court will schedule a hearing when the judge will decide on the long-term protective order. ${ respondent_name } has an opportunity to attend the hearing and contest the order. If the short-term order is not granted, the court may or may not schedule a long-term hearing.
