  What is your name and birthdate?
  % elif (i == 0 and who_needs_the_order == 'child') or (i == 1 and who_needs_the_order == 'self and child'):
  What is your child's name and birthdate?
  % elif who_needs_the_order in ('self and children','children'):
  What is the name and birthdate of the
  % if who_needs_the_order == 'children':
  ${ ordinal(i) }
  % elif who_needs_the_order == 'self and children':
  ${ ordinal(i - 1) }
  % endif
  child who needs the protective order?
  % endif
fields:
  - code: |
      users[i].name_fields()
  - birthdate: users[i].birthdate
    datatype: date
---
code: |
  if who_needs_the_order in ('myself', 'self and child', 'self and children'):
    petitioner_personal_pronoun = 'you'
    petitioner_possesive_pronoun = 'your'
  elif who_needs_the_order == 'child':
    petitioner_personal_pronoun = users[0].familiar()
    petitioner_possesive_pronoun = f"{users[0].familiar()}'s"
  elif who_needs_the_order == 'children':
    petitioner_personal_pronoun = 'the children'
    petitioner_possesive_pronoun = "the children's"
