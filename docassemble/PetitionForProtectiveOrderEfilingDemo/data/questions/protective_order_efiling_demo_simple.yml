comment: |
  2026-11-16 MERGED interview. Built from protective_order_efiling_demo_simple.yml (demo) and
  protective_order_petition.yml (comprehensive); both of those files are untouched.

  HOW IT WORKS
  - Every question/code block that BOTH the demo and the comprehensive interview use lives in this file.
  - demo_interview_order (below) is the pared-down order and is what runs by default.
  - To run the comprehensive interview, un-comment the `include: comprehensive_interview_order.yml`
    block below. That file sets use_comprehensive_order = True, which switches the main order.
  - Shared steps are code blocks (who_needs_the_order_collected, respondent_basics_collected,
    stay_away_from_home_collected) so both orders ask exactly the same questions.

  COPIED SO FAR (work in progress, stopped after the petitioner / advocate contact info)
  - who_needs_the_order (myself, children, self and children, adult, lawyer) and related: parent/guardian screen, names, advocate, relationship
  - respondent name, birthdate, parent/guardian of an under-age respondent
  - term (short or long)
  - stay away from petitioner's home + the address screen
  - petitioner / advocate contact info, the stay-away -> mailing address copy code, and the efile email screens
  - respondent contact info (address, phones, email) and the respondent's parent / guardian contact info

  RULES TO KEEP USING
  - Use advocate_is_contact_person (defined in this file; covers 'children', 'adult' and, for a lawyer,
    lawyer_filing_for in 'child' and 'adult ward') for EVERY "is the advocate the contact person?" test,
    including the data points screen and attachments. The old tests only covered 'child'/'children'.
  - A LAWYER IS NOT THE ADVOCATE. For a lawyer only the bar number is collected (lawyer_bar_number,
    NOT advocate.bar_number); the lawyer answers as if they were the client. When copying the data
    points screen and attachments, anything that reads advocate.bar_number must read lawyer_bar_number.
  - The only "stay away" flag is respondent_stay_away_from_petitioners_home.
  - Email confidentiality is ONE variable, court_email_confidential (was efile_users_email_confidential /
    efile_advocate_email_confidential in the demo). Update anything not yet copied that uses the old names.

  - petition type picker (+ cause_of_action_code), court location (+ court_code)
  - the demo order now ends with court_location, then set_efile_variables / efile_and_email (both defined in efiling_merged.yml)

  - documents (all attachments, bundles, email templates), the download screen, the code that enables each petition
    (uses only_one_petitioner), the petitioner's aliases question

  NOT COPIED YET
  - penultimate screen, address test screen (both left out on purpose for now)
  (efiling_merged.yml, a copy of efiling.yml, is included instead of efiling.yml; it uses advocate_is_contact_person)
---
include:
  - docassemble.AssemblyLine:assembly_line.yml
  - docassemble.ALAnyState:any_state.yml
  - docassemble.AKA2JBranding:custom_organization.yml
  - docassemble.ALToolbox:phone-number-validation.yml
  - efiling.yml
---
metadata:
  title: >-
    Protective Order petition
  short title: >-
    Protective Order petition
  description: |-
    This form allows you to petition the court for a protective order in cases of domestic violence. It can help ensure your safety and the safety of any minors involved.
  can_I_use_this_form: |
    You can use this form if you are seeking protection from domestic violence and need a court order to keep you and your children safe. It is suitable for multiple petitioners, including minors.
  before_you_start: |
    ### Before you get started
    - Gather information about the incidents of domestic violence.
    - Ensure you have the details of { the respondent } and any witnesses.

    ### When you are finished
    - Submit the completed petition to the court.
    - Prepare to attend a hearing if required.
  when_you_are_finished: |
    After you submit your petition, the court will review your request. If granted, the protective order will help keep you and your children safe from { respondent_name }. You may need to attend a hearing for long-term orders.
  efiling_enabled: True
  integrated_efiling: True
  integrated_email_filing: False
  requires_notarization: False
  unlisted: False
  landing_page_url: >-
    https://courtguide.akcourts.gov
  maturity: production
  estimated_completion_minutes: ""
  estimated_completion_delta: ""
  LIST_topics:
    - "FA-07-00-00-00"
  # Keep legacy tags behavior for compatibility with downstream tools.
  tags:
    - "FA-07-00-00-00"
  authors:
    - Alaska Court System, Access to Justice Department
    - Kathleen Doherty
    - Abaigeal O'Briend
    - Braden Seward
    - Jeannie Sato
    - Caroline Robinson
    - Court Forms Online
  original_form: []
  original_form_published_on: ""
  help_page_url: >-
    https://ak-courts.info/dv
  help_page_title: >-
    Domestic Violence, Stalking or Sexual Assault
  allowed_courts: []
  typical_role: "plaintiff"
  al_weaver_version: "2.3.0"
  generated_on: "2026-08-27"
  languages:
    - en
  jurisdiction: "NAM-US-US+AK"
  review_date: 2026-08-27
  form_titles:
    - Protective Order petition
  form_numbers: []
  update_notes: ""
---
code: |
  # This controls the default country and list of states in address field questions
  AL_DEFAULT_COUNTRY = "US"
---
code: |
  # This controls the default state in address field questions
  AL_DEFAULT_STATE = "AK"
---
code: |
  github_repo_name = 'PetitionForProtectiveOrderIssues'
---
template: interview_short_title
content: |
  File your Protective Order petition today
---
code: |
  al_form_type = "starts_case"
---
id: alweaver assemblyline settings
initial: True
code: |
  # These exact-name variables drive the reusable next-steps DOCX shell and
  # are editable in Weaver's AssemblyLine settings panel.
  user_role = "plaintiff"
  user_ask_role = "plaintiff"
  al_next_steps_enabled = False
  al_next_steps_intro_prompt = 'File your Protective Order petition today'
  al_next_steps_title = 'Protective Order petition'
  al_next_steps_document_title = 'petition'
  al_next_steps_document_purpose = 'application'
  al_next_steps_help_organization = 'Alaska Legal Services Corporation'
  al_next_steps_help_url = 'https://www.alsc-law.org'
  al_next_steps_generate_qr_code = False
  al_next_steps_what_happens_next = 'After you submit your petition, the court will review your request. If granted, the protective order will help keep you and your children safe from ${ respondent_name }. You may need to attend a hearing for long-term orders.'
  al_next_steps_what_can_decision_maker_do = 'The judge can issue temporary protective orders or schedule a hearing for long-term orders. They can also deny the request if there is insufficient evidence.'
  al_next_steps_what_happens_if_i_win = 'If you win the protective order, you will receive legal protection against ${ respondent_name } for the duration specified. This may include restrictions on contact and requirements for ${ respondent_name } to stay away from you and your children.'
---
objects:
  - users: ALPeopleList.using(ask_number=True)
  - advocate: ALIndividual
  - children: ALPeopleList.using(ask_number=True, there_are_any=True, complete_attribute='complete')
  - other_parties: ALPeopleList.using(there_are_any=True, there_is_another=False, target_number=1)
  - adult_for_respondent: ALIndividual
---
objects:
  - users[i].stay_away_home_address: ALAddress
  - users[i].confidential_address: ALAddress
  - advocate.confidential_address: ALAddress
---
terms:
  respondent: |
    The person you or your children need protection from.
---
code: |
  al_name_suffixes = [
    "Jr.",
    "Sr.",
    "II",
    "III",
    "IV",
    "MD",
    "PhD",
    "Esq."
  ]
---
features:
  address autocomplete: True

  css: |
    .alert, .alert p {
      font-size: 1rem !important;
    }

---
code: |
  # Default: run the pared-down demo order.
  # comprehensive_interview_order.yml (included below, when un-commented) sets this to True.
  # It MUST stay above the include so the included file's value wins.
  use_comprehensive_order = False
---
code: |
  # TESTING SWITCH. True = run the interview only: no e-filing screens (no "Do you want to e-file?", no efile
  # email screen) and nothing is sent to the court. Change to False to test e-filing.
  test_without_efiling = False
---
code: |
  # Use this instead of can_check_efile everywhere in this interview.
  efiling_this_run = can_check_efile and not test_without_efiling
---
code: |
  # True only if e-filing was on AND the user answered "Yes" to "Do you want to e-file?" (user_wants_efile, asked
  # in efiling_merged.yml). Used by the download screen so it does not say "Something went wrong delivering
  # your form" when the user chose not to e-file.
  efile_attempted = efiling_this_run and showifdef('user_wants_efile', True)
---
# ------------------------------------------------------------------------------------
# TO RUN THE COMPREHENSIVE INTERVIEW: un-comment the next 2 lines (the include block).
# ------------------------------------------------------------------------------------
# include:
#   - comprehensive_interview_order.yml
---
mandatory: True
id: main interview order
code: |
  if use_comprehensive_order:
    comprehensive_interview_order
  else:
    demo_interview_order
  protective_order_petition_download
---
id: demo interview order
code: |
  set_parts(
    title="",
    short_title="",
    tab_title="CIPO")
  dynamic_navbar_title = ""

  who_needs_the_order_collected
  respondent_basics_collected

  petition_type_collected
  term

  stay_away_from_home_collected

  petitioner_contact_info_collected

  respondent_contact_info_collected

  court_location

  # TODO (left out for now): address_test_results (TEMPORARY), penultimate_screen
  # The court case management system needs the cause of action code, but we do not show it to the user
  # (the demo's penultimate_screen used to display it, which is what made it get computed).
  cause_of_action_code
  if efiling_this_run:
    set_efile_variables
    efile_and_email
  demo_interview_order = True
---
########################################################################
# Shared steps - used by BOTH the demo order and the comprehensive order
########################################################################
id: who needs the order collected
code: |
  who_needs_the_order
  if who_needs_the_order == 'lawyer':
    lawyer_filing_for
    if lawyer_filing_for in ('adult', 'adult ward'):
      users.target_number = 1
    elif lawyer_filing_for == 'child':
      users.target_number = lawyer_number_of_children
    elif lawyer_filing_for == 'adult and child':
      # users[0] is the adult, the rest are the children
      users.target_number = lawyer_number_of_children + 1
    # The lawyer is NOT the advocate. Only their bar number is collected (lawyer_bar_number).
    # The lawyer answers as if they were the client:
    #   'adult'           -> like 'myself'            (no advocate)
    #   'adult and child' -> like 'self and children' (no advocate; users[0] is the adult)
    #   'child'           -> like 'children'          (advocate = the adult filing for the child)
    #   'adult ward'      -> like 'adult'             (advocate = the guardian)
    if lawyer_filing_for in ('child', 'adult ward'):
      advocate.name.first
  elif who_needs_the_order in ('myself', 'adult'):
    users.target_number = 1
  elif who_needs_the_order == 'children':
    users.target_number = number_of_children
  elif who_needs_the_order == 'self and children':
    # users[0] is the parent, the rest are the children
    users.target_number = number_of_children + 1
  if who_needs_the_order == 'self and children':
    parent_or_guardian
    if choose_petitioners_again == 'change':
      who_needs_the_order = 'myself'
      users.target_number = 1
  for i in range(users.number()):
    users[i].name.first
  if who_needs_the_order in ('children', 'adult'):
    advocate.name.first
    if who_needs_the_order == 'children' and advocate.age_in_years() < 18:
      kickout_advocate_is_too_young
    else:
      for i in range(users.number()):
        if who_needs_the_order == 'adult':
          # a guardian filing for an adult ward: no need to ask
          users[i].relationship_to_advocate = 'guardian'
        else:
          users[i].relationship_to_advocate
  if who_needs_the_order == 'lawyer':
    # Only 'child' and 'adult ward' have an advocate. 'adult' and 'adult and child' have none.
    for i in range(users.number()):
      if lawyer_filing_for == 'adult ward':
        users[i].relationship_to_advocate = 'guardian'
      elif lawyer_filing_for == 'child':
        users[i].relationship_to_advocate
  who_needs_the_order_collected = True
---
id: petitioner group
code: |
  # Groups every who_needs_the_order / lawyer_filing_for combination into one of 4 wordings,
  # so the question text does not need a long if/elif chain on each screen:
  #   'you'               the person answering (or, for a lawyer, the petitioner) is the only petitioner
  #   'one person'        one named person (a child, an adult ward, or a client)
  #   'children'          more than one child
  #   'you and children'  the person answering (or the lawyer's adult client) and one or more children
  if who_needs_the_order == 'myself' or (who_needs_the_order == 'lawyer' and lawyer_filing_for == 'adult'):
    petitioner_group = 'you'
  elif who_needs_the_order == 'adult' or (who_needs_the_order == 'children' and users.target_number == 1) or (who_needs_the_order == 'lawyer' and (lawyer_filing_for == 'adult ward' or (lawyer_filing_for == 'child' and users.target_number == 1))):
    petitioner_group = 'one person'
  elif who_needs_the_order == 'children' or (who_needs_the_order == 'lawyer' and lawyer_filing_for == 'child'):
    petitioner_group = 'children'
  else:
    petitioner_group = 'you and children'
---
id: advocate is contact person
code: |
  # True when the advocate (the parent, guardian or lawyer filling out the interview) is the person
  # the court contacts, so the advocate's contact info is collected instead of users[0]'s.
  # Use this one variable on every contact screen / address-copy step / order test, so they cannot drift apart.
  advocate_is_contact_person = (
    who_needs_the_order in ('children', 'adult')
    or (who_needs_the_order == 'lawyer' and lawyer_filing_for in ('child', 'adult ward'))
  )
---
id: respondent basics collected
code: |
  if respondent_name_known and not other_parties[0].name.full() == "":
    respondent_name = other_parties[0].familiar()
  else:
    other_parties[0].name.first = 'unknown'
    respondent_name = 'the respondent'

  knows_respondents_birthdate
  if other_parties[0].age_in_years() < 18:
    if knows_adult_for_respondent:
      adult_for_respondent.name.first
  respondent_basics_collected = True
---
id: stay away from home collected
code: |
  respondent_stay_away_from_petitioners_home
  if respondent_stay_away_from_petitioners_home:
    get_users_stay_away_home_address
  stay_away_from_home_collected = True
---
########################################################################
# Who needs protection (5 choices: myself, children, self and children, adult, lawyer) and related questions
########################################################################
id: who needs a protective order
question: |
  Who needs protection?
fields:
  - Who is the order for?: who_needs_the_order
    datatype: radio
    choices:
    - "Me. I need a protective order for myself.": myself
    - "A minor child or children.": children
    - "Myself and a minor child or children.": self and children
    - "An adult I am a guardian for.": adult
    - "I am a lawyer, filing for a client.": lawyer

  - note: |
      Only choose "I am a lawyer, ..." if you are going to enter an appearance in this case.  You will need to upload the EOA before you file your client's petition using this tool.
    show if:
      variable: who_needs_the_order
      is: lawyer
  - What is your bar number?: lawyer_bar_number
    show if:
      variable: who_needs_the_order
      is: lawyer
###### Braden's number for testing - remove before production ####
    default: 22-11105
  - How many children?: number_of_children
    datatype: integer
    min: 1
    max: 10
    js show if: |
      val('who_needs_the_order') == 'self and children' || val('who_needs_the_order') == 'children'
under: |
  #### <i class="fa-regular fa-lightbulb"></i> Learn More ####
  Under Alaska law you can file for your minor child if you are their parent or legal guardian.
---
code: |
  if advocate_is_contact_person:
    al_person_answering = 'advocate'
  else:
    al_person_answering = 'user'
---
id: lawyer's question
question: |
  Who are the petitioners you are filing for?
fields:
  - no label: lawyer_filing_for
    input type: radio
    choices:
      - An adult.: adult
      - An adult filing for a child or children.: child
      - An adult and a minor child or children.: adult and child
      - An adult guardian filing on behalf of a protected adult.: adult ward
  - How many children?: lawyer_number_of_children
    datatype: integer
    min: 1
    max: 10
    js show if: |
      val('lawyer_filing_for') == 'adult and child' || val('lawyer_filing_for') == 'child'
  - note: |
      Answer the remaining questions as if you were the petitioner.  For example, include the petitioner’s contact information rather than your own.
---
id: parent or guardian education
question: |
  Parent or Guardian Information
subquestion: |
      You asked for a protective order for you and your ${ "child" if number_of_children == 1 else "children" }. For the judge to grant a protective order for your ${ "child" if number_of_children == 1 else "children" }, you will have to show that the other person committed a crime of domestic violence against your ${ "child" if number_of_children == 1 else "children" }.

      If the other person committed a crime of domestic violence against you but not your ${ "child" if number_of_children == 1 else "children" }, the judge can still include these protections in your order:

        * temporary orders about where your ${ "child" if number_of_children == 1 else "children" } will live.
        * child support. And
        * the other person to stay away from specific locations, including your ${ "child" if number_of_children == 1 else "children" }'s school.

      You can ask for these things even if the other person did not commit domestic violence against your child.
fields:
  - "What do you want to do?": choose_petitioners_again
    input type: radio
    choices:
      - Ask only for myself: change
      - Ask for me and my ${ "child" if number_of_children == 1 else "children" }: keep

continue button field: parent_or_guardian
---
id: protected person name
sets:
  - "users[i].name.first"
  - "users[i].name.middle"
  - "users[i].name.last"
  - "users[i].name.suffix"
question: |
  % if i == 0 and petitioner_group in ('you', 'you and children'):
  What is your name and birthdate?
  % elif petitioner_group == 'one person':
  % if who_needs_the_order == 'children':
  What is your child's name and birthdate?
  % elif who_needs_the_order == 'adult' or (who_needs_the_order == 'lawyer' and lawyer_filing_for == 'adult ward'):
  What is the name and birthdate of the adult you are a guardian for?
  % else:
  What is the name and birthdate of the person who needs the protective order?
  % endif
  % elif petitioner_group == 'you and children' and users.target_number == 2:
  What is ${ "the" if who_needs_the_order == 'lawyer' else "your" } child's name and birthdate?
  % else:
  What is the name and birthdate of the
  % if petitioner_group == 'children':
  ${ ordinal(i) }
  % else:
  ${ ordinal(i - 1) }
  % endif
  child who needs the protective order?
  % endif
fields:
  - code: |
      users[i].name_fields()
  - Birthdate: users[i].birthdate
    datatype: date
validation code: |
  # 1. Determine if the person at the current index 'i' is an adult or child
  is_adult = False
  is_child = False
  is_adult_ward = False

  if who_needs_the_order in ('myself', 'self and children') and i == 0:
      is_adult = True
  elif who_needs_the_order == 'children':
      is_child = True
  elif who_needs_the_order == 'self and children' and i >= 1:
      is_child = True
  elif who_needs_the_order == 'adult' or (who_needs_the_order == 'lawyer' and lawyer_filing_for == 'adult ward'):
      is_adult_ward = True

  # 2. Calculate the exact age threshold date
  eighteen_years_ago = today().minus(years=18)

  # 3. Apply the specific validation rules explicitly targeting this user index
  if is_adult and users[i].birthdate > eighteen_years_ago:
      validation_error("You must be 18 years or older to file for yourself.")

  if is_adult_ward and users[i].birthdate > eighteen_years_ago:
      validation_error("The adult you are a guardian for must be 18 years or older.")

  if is_child and users[i].birthdate <= eighteen_years_ago:
      validation_error("The child must be under 18 years old.")
---
code: |
  if petitioner_group in ('you', 'you and children'):
    petitioner_personal_pronoun = 'you'
    petitioner_possesive_pronoun = 'your'
  elif petitioner_group == 'one person':
    petitioner_personal_pronoun = users[0].familiar()
    petitioner_possesive_pronoun = f"{users[0].familiar()}'s"
  else:
    petitioner_personal_pronoun = 'the children'
    petitioner_possesive_pronoun = "the children's"
---
id: Advocate info
sets:
  - "advocate.name.first"
  - "advocate.name.middle"
  - "advocate.name.last"
  - "advocate.name.suffix"
question: |
  What is your name and birthdate?
fields:
  - note: What is your name?
  - code: |
      advocate.name_fields()
  - Your birthdate: advocate.birthdate
    datatype: date
    max: ${ today() }
---
id: kickout when advocate is too young to file
event: kickout_advocate_is_too_young
question: |
  You have to be 18 to file a petition for a Protective Order for someone else
subquestion: |
  If you made a mistake, go back and change your birthdate.

  The **Exit** button, takes you to the court's Domestic Violence, Sexual Assault and Stalking Protective Orders web page.
buttons:
  - Exit and delete my answers: exit
    url: https://ak-courts.info/dv
  - Start over: restart
---
id: relationship to advocate
question: |
  How are you related to ${ users[i].familiar() }?
subquestion: |
  Alaska only allows a child's parent or guardian to file a petition for a protective order for the child.

  But in certain circumstances, a judge **may** give you a **temporary guardianship** so you can ask for a protective order for the child.
fields:
  - "I am ${ users[i].name.familiar() }'s": users[i].relationship_to_advocate
    datatype: radio
    choices:
      - parent
      - guardian
      - other
---
########################################################################
# Respondent basics
########################################################################
id: Respondent's name and birthdate
question: |
  Who
  % if petitioner_group == 'you':
  do you need
  % elif petitioner_group == 'one person':
  does ${ users[0].name.familiar() } need
  % elif petitioner_group == 'children':
  do ${ comma_and_list([u.name.familiar() for u in users]) } need
  % elif petitioner_group == 'you and children':
  do you and ${ comma_and_list([u.name.familiar() for u in users[1:]]) } need
  % endif
  protection from?
fields:
  - Do you know their name?: respondent_name_known
    datatype: yesnoradio
  - First name: other_parties[0].name.first
    show if: respondent_name_known
    required: False
  - Middle name: other_parties[0].name.middle
    show if: respondent_name_known
    required: False
  - Last name: other_parties[0].name.last
    show if: respondent_name_known
    required: False
  - Suffix: other_parties[0].name.suffix
    code: |
      al_name_suffixes
    show if: respondent_name_known
    required: False
validation code: |
  if respondent_name_known and not showifdef('other_parties[0].name.first') and (not showifdef('other_parties[0].name.middle') and not showifdef('other_parties[0].name.last')):
    validation_error(word("You say you know the other person's name, please enter at least one name or say you do not know their name."))
---
id: respondent birthdate
question: |
  How old is ${ respondent_name }?
fields:
  - Do you know ${ respondent_name }'s birthdate?: knows_respondents_birthdate
    datatype: yesnoradio
    label above field: True
  - What is ${ respondent_name }'s birthdate?: other_parties[0].birthdate
    datatype: BirthDate
    show if:
      variable: knows_respondents_birthdate
      is: True
    label above field: True
  - How old do you think ${ respondent_name } is, in years?: other_parties[0].age
    datatype: integer
    show if:
      variable: knows_respondents_birthdate
      is: False
    label above field: True
---
id: Do you know respondent's parent or guardian?
question: |
  % if respondent_name_known:
  Do you know ${ respondent_name }'s parent or guardian?
  % else:
  Do you know { the respondent }'s parent or guardian?
  % endif
subquestion: |
  Because
  % if respondent_name_known:
  ${ respondent_name }
  % else:
  { the respondent }
  % endif
  is under 18, the court may need to contact an adult responsible for them.
fields:
  - Do you know ${ respondent_name }'s parent's or guardian's name?: knows_adult_for_respondent
    datatype: yesnoradio
    label above field: True
---
id: adult for under-age respondent
sets:
  - "adult_for_respondent.name.first"
  - "adult_for_respondent.name.middle"
  - "adult_for_respondent.name.last"
  - "adult_for_respondent.name.suffix"
question: |
  Who is responsible for ${ respondent_name }?
fields:
